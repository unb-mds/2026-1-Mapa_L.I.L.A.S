name: Atualiza Métricas SCRUM

on:
  schedule:
    - cron: '0 3 * * 0'   # Todo domingo às 03:00 UTC
  workflow_dispatch:        # Permite execução manual pela UI do GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install PyGithub

      - name: Executar analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python metrics/analyzer.py

      - name: Garantir estrutura de pastas
        run: mkdir -p docs/scrum

      - name: Commit e push das métricas atualizadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/scrum/metrics.json
          git diff --staged --quiet || git commit -m "chore: atualiza métricas scrum [skip ci]"
          git push

  deploy-pages:
    needs: build-and-commit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build

      - name: Incluir dashboards no site
        run: |
          if [ -d "docs/scrum" ]; then
            cp -r docs/scrum site/scrum
          else
            echo "docs/scrum não encontrada — pulando."
          fi
          if [ -d "docs/ingestion" ]; then
            cp -r docs/ingestion site/ingestion
          else
            echo "docs/ingestion não encontrada — pulando."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5